name: Signed Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build sigstore
          python -m build
          cd dist
          sha256sum * > SHA256SUMS

      - name: Sign release artifacts
        run: |
          python -m sigstore sign --bundle dist/SHA256SUMS.sigstore dist/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
